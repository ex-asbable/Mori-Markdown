<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: http: https: file:; font-src 'self'; connect-src 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mori Markdown</title>
    <link rel="stylesheet" href="../node_modules/katex/dist/katex.min.css" />
    <link id="highlight-theme-light" rel="stylesheet" href="../node_modules/@highlightjs/cdn-assets/styles/github.min.css" />
    <link id="highlight-theme-dark" rel="stylesheet" href="../node_modules/@highlightjs/cdn-assets/styles/github-dark.min.css" disabled />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="titlebar">
      <div class="brand" aria-label="Mori Markdown">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 18.2V5.8L12 13l7-7.2v12.4" />
        </svg>
        <span>Mori</span>
      </div>
      <div id="document-title" class="document-title" role="button" tabindex="0" title="点击重命名">
        <span id="document-name">未命名</span>
        <input id="document-name-input" class="document-name-input" type="text" maxlength="180" aria-label="文件名" spellcheck="false" />
        <span id="document-extension" class="document-extension">.md</span>
      </div>
    </header>

    <nav class="toolbar" aria-label="文档工具栏">
      <div class="toolbar-group file-actions">
        <button id="new-button" class="icon-button" title="新建（Ctrl+N）" aria-label="新建文档">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>
        </button>
        <button id="open-button" class="icon-button" title="打开（Ctrl+O）" aria-label="打开文档">
          <svg viewBox="0 0 24 24"><path d="M3.5 7.5h6l2-2h9v13h-17z" /></svg>
        </button>
        <button id="save-button" class="icon-button" title="保存（Ctrl+S）" aria-label="保存文档">
          <svg viewBox="0 0 24 24"><path d="M5 4h12l2 2v14H5zM8 4v6h8V4M8 20v-6h8v6" /></svg>
        </button>
        <button id="save-as-button" class="icon-button" title="另存为（Ctrl+Shift+S）" aria-label="另存为">
          <svg viewBox="0 0 24 24"><path d="M5 4h12l2 2v14H5zM8 4v6h8V4M12 14v6M9 17h6" /></svg>
        </button>
      </div>

      <div class="mode-switcher" role="group" aria-label="视图模式">
        <button class="mode-button active" data-mode="edit">编辑</button>
        <button class="mode-button" data-mode="split">预览</button>
        <button class="mode-button" data-mode="read">阅读</button>
      </div>

      <div class="toolbar-group right-actions">
        <button id="theme-button" class="text-button" title="切换深色模式" aria-label="深色模式" aria-pressed="false">深色</button>
        <button id="export-html-button" class="text-button export-button" title="导出为 HTML">HTML</button>
        <button id="export-pdf-button" class="text-button export-button" title="导出为 PDF">PDF</button>
        <button id="wrap-button" class="text-button active" title="切换自动换行" aria-pressed="true">换行</button>
      </div>
    </nav>

    <main id="workspace" class="workspace mode-edit">
      <section class="editor-pane" aria-label="Markdown 编辑器">
        <pre id="editor-highlight" class="editor-highlight" aria-hidden="true"><code></code></pre>
        <textarea id="editor" spellcheck="false" aria-label="Markdown 文本"></textarea>
        <div id="editor-mirror" class="editor-mirror" aria-hidden="true"></div>
      </section>
      <div class="divider" aria-hidden="true"></div>
      <section class="preview-pane" aria-label="文档预览">
        <article id="preview" class="markdown-body"></article>
      </section>
      <div id="master-scrollbar" class="master-scrollbar" aria-label="同步滚动条" tabindex="0">
        <div id="master-scroll-track"></div>
      </div>
    </main>

    <footer class="statusbar">
      <div class="status-left">
        <span id="save-state">已保存</span>
      </div>
      <div class="status-right">
        <span id="cursor-state">行 1，列 1</span>
        <span id="word-count">0 字</span>
        <span>Markdown + TeX</span>
      </div>
    </footer>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <dialog id="file-name-dialog" class="file-name-dialog">
      <form id="file-name-form">
        <h2 id="file-name-dialog-title">重命名文档</h2>
        <label class="file-name-field">
          <span class="sr-only">文件名</span>
          <input id="file-name-input" type="text" maxlength="180" autocomplete="off" spellcheck="false" />
          <span id="file-name-extension" class="file-name-extension">.md</span>
        </label>
        <p id="file-name-error" class="file-name-error" role="alert"></p>
        <div class="dialog-actions">
          <button id="file-name-cancel" type="button" class="dialog-button">取消</button>
          <button id="file-name-confirm" type="submit" class="dialog-button primary">重命名</button>
        </div>
      </form>
    </dialog>

    <script src="../node_modules/marked/lib/marked.umd.js"></script>
    <script src="../node_modules/dompurify/dist/purify.min.js"></script>
    <script src="../node_modules/katex/dist/katex.min.js"></script>
    <script src="../node_modules/@highlightjs/cdn-assets/highlight.min.js"></script>
    <script src="../node_modules/@highlightjs/cdn-assets/languages/latex.min.js"></script>
    <script src="./undo-history.js"></script>
    <script src="./renderer.js"></script>
    <script src="./find-replace.js"></script>
  </body>
</html>
