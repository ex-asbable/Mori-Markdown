name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and publish Windows release
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Verify release metadata
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_EVENT_NAME -eq "push") {
            $tagVersion = $env:GITHUB_REF_NAME.TrimStart("v")
            if ($tagVersion -ne $packageVersion) {
              throw "Tag $env:GITHUB_REF_NAME does not match package version $packageVersion"
            }
          }
          "APP_VERSION=$packageVersion" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run unit tests
        run: npm test

      - name: Run Electron smoke test
        run: npm run smoke

      - name: Build Windows executables
        run: npm run dist -- --publish never

      - name: Create checksums
        shell: pwsh
        run: |
          $files = @(
            "release\Mori-Markdown-Setup-$env:APP_VERSION-x64.exe"
            "release\Mori-Markdown-Portable-$env:APP_VERSION-x64.exe"
          )
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([System.IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content -LiteralPath "release\SHA256SUMS.txt" -Encoding utf8

      - name: Upload manual build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Mori-Markdown-windows-x64
          path: |
            release/Mori-Markdown-Setup-*.exe
            release/Mori-Markdown-Portable-*.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Publish GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            "release\Mori-Markdown-Setup-$env:APP_VERSION-x64.exe"
            "release\Mori-Markdown-Portable-$env:APP_VERSION-x64.exe"
            "release\SHA256SUMS.txt"
          )

          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:GITHUB_REF_NAME $assets --clobber
          } else {
            gh release create $env:GITHUB_REF_NAME $assets `
              --verify-tag `
              --title "Mori Markdown $env:GITHUB_REF_NAME" `
              --generate-notes
          }

          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release publishing failed with exit code $LASTEXITCODE"
          }
